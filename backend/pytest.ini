[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    postgres: needs a real PostgreSQL (set TEST_POSTGRES_URL); verifies migrations, RLS and triggers
    network: needs outbound network access (set RUN_NETWORK_TESTS=1)
    hsp_live: hits the REAL HSP QA gateway (needs HSP_LIVE_QA=1 + HSP_QA_* credentials; moves no funds)
filterwarnings =
    ignore:Dialect sqlite\+aiosqlite does \*not\* support Decimal objects natively:sqlalchemy.exc.SAWarning
